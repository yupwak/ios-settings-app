name: sign-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'signing/**'

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      BUNDLE_ID: com.duI6G.2cboa
    steps:
      - uses: actions/checkout@v4

      - name: Import certificate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/certs"
          python3 -c 'import base64,sys;open(sys.argv[2],"wb").write(base64.b64decode(open(sys.argv[1]).read()))' "$PWD/signing/cert.p12.b64" "$RUNNER_TEMP/certs/cert.p12"
          python3 -c 'import base64,sys;open(sys.argv[2],"wb").write(base64.b64decode(open(sys.argv[1]).read()))' "$PWD/signing/profile.b64" "$RUNNER_TEMP/certs/app.mobileprovision"
          PASS="$(cat signing/pass.txt)"
          P12="$RUNNER_TEMP/certs/cert.p12"
          PEM="$RUNNER_TEMP/certs/all.pem"
          openssl version
          if openssl pkcs12 -in "$P12" -passin "pass:$PASS" -nodes -out "$PEM" 2>"$RUNNER_TEMP/certs/p12.err"; then
            echo "p12 password ok"
          elif openssl pkcs12 -in "$P12" -passin "pass:" -nodes -out "$PEM" 2>/dev/null; then
            echo "p12 has empty password"
            PASS=""
          else
            echo "=== p12 error ==="; cat "$RUNNER_TEMP/certs/p12.err"; exit 1
          fi
          grep -c "BEGIN CERTIFICATE" "$PEM" || true
          grep -c "BEGIN.*PRIVATE KEY" "$PEM" || true
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p ci build.keychain
          # macOS 只认旧式 PKCS12（3DES + SHA1 MAC），新 OpenSSL 默认 AES/PBKDF2 会报 MAC verification failed
          openssl pkcs12 -export -in "$PEM" -out "$RUNNER_TEMP/certs/fixed.p12" -passout "pass:$PASS" \
            -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 -iter 2048 \
            || openssl pkcs12 -export -in "$PEM" -out "$RUNNER_TEMP/certs/fixed.p12" -passout "pass:$PASS"
          if ! security import "$RUNNER_TEMP/certs/fixed.p12" -k build.keychain -P "$PASS" -T /usr/bin/codesign -A; then
            echo "p12 import failed, fallback to PEM"
            security import "$PEM" -k build.keychain -f pemseq -T /usr/bin/codesign -A
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain >/dev/null
          security list-keychains -d user -s build.keychain
          # Apple WWDR 中间证书，缺它 codesign 认不出签名身份
          for CA in AppleWWDRCAG4.cer AppleWWDRCAG3.cer; do
            curl -fsSL -o "$RUNNER_TEMP/certs/$CA" "https://www.apple.com/certificateauthority/$CA" || true
            security import "$RUNNER_TEMP/certs/$CA" -k build.keychain -T /usr/bin/codesign >/dev/null 2>&1 || true
          done
          openssl x509 -in "$PEM" -out "$RUNNER_TEMP/certs/leaf.pem" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/certs/leaf.pem" ]; then
            security import "$RUNNER_TEMP/certs/leaf.pem" -k build.keychain -T /usr/bin/codesign >/dev/null 2>&1 || true
          fi
          echo "--- identities ---"
          security find-identity -v -p codesigning build.keychain || true
          security cms -D -i "$RUNNER_TEMP/certs/app.mobileprovision" > "$RUNNER_TEMP/certs/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Entitlements" "$RUNNER_TEMP/certs/profile.plist" > "$RUNNER_TEMP/certs/entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$RUNNER_TEMP/certs/profile.plist"

      - name: Install XcodeGen
        run: |
          set -e
          if command -v xcodegen >/dev/null 2>&1; then echo "XCODEGEN=xcodegen" >> "$GITHUB_ENV"; exit 0; fi
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen >/dev/null 2>&1 || true
          if command -v xcodegen >/dev/null 2>&1; then echo "XCODEGEN=xcodegen" >> "$GITHUB_ENV"; exit 0; fi
          URL=$(curl -fsSL https://api.github.com/repos/yonaskolb/XcodeGen/releases/latest \
            | jq -r '.assets[] | select(.name | test("xcodegen.*\\.zip")) | .browser_download_url' | head -1)
          curl -fsSL -o /tmp/xcodegen.zip "$URL"
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xg
          BIN=$(find /tmp/xg -type f -name xcodegen | head -1)
          chmod +x "$BIN"
          echo "XCODEGEN=$BIN" >> "$GITHUB_ENV"

      - name: Generate app icon
        run: node tools/mkicon.mjs SettingsApp/Assets.xcassets/AppIcon.appiconset/icon1024.png

      - name: Generate Xcode project
        run: $XCODEGEN generate --spec project.yml

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project SettingsApp.xcodeproj \
            -scheme SettingsApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Sign
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SettingsApp.app"
          cp "$RUNNER_TEMP/certs/app.mobileprovision" "$APP/embedded.mobileprovision"
          ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Apple/{print $2; exit}')
          if [ -z "$ID" ]; then
            ID=$(openssl x509 -in "$RUNNER_TEMP/certs/leaf.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
            echo "fallback to cert fingerprint"
          fi
          echo "signing with: $ID"
          test -n "$ID"
          codesign --force --sign "$ID" \
            --entitlements "$RUNNER_TEMP/certs/entitlements.plist" \
            --timestamp=none "$APP"
          echo "--- verify ---"
          codesign -dv --entitlements :- "$APP" 2>&1 | head -40
          codesign --verify --deep "$APP" && echo "codesign OK"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          ls -la "$APP"

      - name: Package signed IPA
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R build/Build/Products/Release-iphoneos/SettingsApp.app "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          rm -f SettingsApp-signed.ipa
          zip -qry SettingsApp-signed.ipa Payload
          ls -lh SettingsApp-signed.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signed-${{ github.run_number }}
          name: signed ${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            SettingsApp-signed.ipa
            build.log
